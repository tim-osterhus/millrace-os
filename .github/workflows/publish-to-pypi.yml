name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    tags: [v0.23.0]

permissions:
  contents: read

env:
  # Independent of the commit containing only publication digest pins.
  SOURCE_DATE_EPOCH: '1580601600'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  # P8d must freeze these exact reviewed artifact digests before the release tag.
  EXPECTED_WHEEL_SHA256: "e0834a68455cf9988274b14374b3b37f5e8083b91337487254a6cd07ca202d77"
  EXPECTED_SDIST_SHA256: "2822bffb83999702131f6e1127920271acaba42792f67feabebace63bb896c32"
  CORE_WHEEL_SHA256: "56d4bd001c9c5875b6f7fec55369754c43a07f5d2ce0e334a2057c63521b858c"
  PLUS_WHEEL_SHA256: "5c2025e4f6d592bf4c927d659b4d729e17a62e49bc13f5b380de1b2d6bff480f"

jobs:
  tests:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/tags/v0.23.0') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: 6d000614bb61b60e4ec3b40430813a531be0179b
          fetch-depth: 0
      - name: Verify immutable release source and control-only recovery
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          source = "6d000614bb61b60e4ec3b40430813a531be0179b"
          assert git("rev-parse", "HEAD") == source
          assert git("rev-parse", "refs/tags/v0.23.0") == "304c82196392b25bc95f2cc4d8f5886b41a07bd2"
          assert git("rev-parse", "refs/tags/v0.23.0^{}") == source
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              assert os.environ["GITHUB_REF"] == "refs/heads/main"
              changed = git("diff", "--name-only", source, os.environ["GITHUB_SHA"]).splitlines()
              assert changed == [".github/workflows/publish-to-pypi.yml"], changed
          else:
              assert os.environ["GITHUB_EVENT_NAME"] == "push"
              assert os.environ["GITHUB_REF"] == "refs/tags/v0.23.0"
              assert os.environ["GITHUB_SHA"] == source
          PYCODE
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: 0.13.5
      - name: Require final public registry lock
        run: |
          test -f uv.lock
          uv lock --check --no-sources --python 3.12
          python3 - <<'PYCODE'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())
          assert not project.get("tool", {}).get("uv", {}).get("sources")
          lock = tomllib.loads(Path("uv.lock").read_text())
          versions = {}
          for package in lock["package"]:
              source = package["source"]
              if package["name"] == "millrace-os":
                  assert source == {"editable": "."}
              else:
                  assert source == {"registry": "https://pypi.org/simple"}, source
              if package["name"] in {"millrace-ai", "millrace-plus", "millrace-os"}:
                  versions[package["name"]] = package["version"]
          assert versions == {"millrace-ai": "0.23.0", "millrace-plus": "0.23.0", "millrace-os": "0.23.0"}
          PYCODE
          uv sync --frozen --no-editable --extra dev --extra router --python 3.12
      - name: Verify selected installed identities outside checkout
        shell: bash
        run: |
          python_path="$PWD/.venv/bin/python"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$python_path" - <<'PY'
          import importlib.metadata as m
          from pathlib import Path
          import millrace, millrace_plus, millrace_os
          for name, module in [('millrace-ai', millrace), ('millrace-plus', millrace_plus), ('millrace-os', millrace_os)]:
              assert m.version(name) == '0.23.0', name
              assert 'site-packages' in str(Path(module.__file__).resolve()), module.__file__
          from millrace_plus.router import require_core
          require_core()
          PY
      - name: Active OS tests and lint
        run: |
          env -u PYTHONPATH .venv/bin/python -m pytest -q -o pythonpath= tests
          .venv/bin/ruff check src tests
      - name: Build wheel and sdist
        run: uv build --python 3.12 --force-pep517
      - name: Verify base installation without router dependencies
        shell: bash
        run: |
          uv venv --python 3.12 .ci-base
          uv pip install --python .ci-base/bin/python dist/millrace_os-0.23.0-py3-none-any.whl
          python_path="$PWD/.ci-base/bin/python"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$python_path" - <<'PY'
          import importlib.util, tempfile
          from pathlib import Path
          assert importlib.util.find_spec('millrace') is None
          assert importlib.util.find_spec('millrace_plus') is None
          from millrace_os.config import ApplicationConfig
          from millrace_os.router_client import RouterClient, RouterUnavailable
          from millrace_os.service import Service
          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              service = Service(ApplicationConfig(config_dir=root/'config', state_dir=root/'state', credential_path=root/'config/credentials.json'))
              assert service.app.version == '0.23.0'
              try:
                  RouterClient({'main': root/'core'}).list_instances('main')
              except RouterUnavailable as error:
                  assert error.code == 'router_unavailable'
              else:
                  raise AssertionError('missing optional router must refuse')
          PY
      - name: Check source unchanged
        run: git diff --exit-code
  build:
    needs: tests
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/tags/v0.23.0') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          ref: 6d000614bb61b60e4ec3b40430813a531be0179b
          fetch-depth: 0
      - name: Verify immutable release source and control-only recovery
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          source = "6d000614bb61b60e4ec3b40430813a531be0179b"
          assert git("rev-parse", "HEAD") == source
          assert git("rev-parse", "refs/tags/v0.23.0") == "304c82196392b25bc95f2cc4d8f5886b41a07bd2"
          assert git("rev-parse", "refs/tags/v0.23.0^{}") == source
          if os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch":
              assert os.environ["GITHUB_REF"] == "refs/heads/main"
              changed = git("diff", "--name-only", source, os.environ["GITHUB_SHA"]).splitlines()
              assert changed == [".github/workflows/publish-to-pypi.yml"], changed
          else:
              assert os.environ["GITHUB_EVENT_NAME"] == "push"
              assert os.environ["GITHUB_REF"] == "refs/tags/v0.23.0"
              assert os.environ["GITHUB_SHA"] == source
          PYCODE
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: 0.13.5
          checksum: f68d291c75783122dad58ab77def0e13f3233f358731db5d6d7e8715603b928f
      - name: Require final public registry lock and exact upstream artifacts
        run: |
          test -f uv.lock
          uv lock --check --python 3.12
          uv sync --frozen --no-editable --extra dev --extra router --python 3.12
          .venv/bin/python - <<'PY'
          import hashlib, json, os, re, tomllib, urllib.request
          from pathlib import Path
          for key in ['EXPECTED_WHEEL_SHA256', 'EXPECTED_SDIST_SHA256', 'CORE_WHEEL_SHA256', 'PLUS_WHEEL_SHA256']:
              assert re.fullmatch('[0-9a-f]{64}', os.environ[key]), key + ' must be frozen in P8d'
          lock = tomllib.loads(Path('uv.lock').read_text())
          for package in lock['package']:
              source = package['source']
              if package['name'] == 'millrace-os':
                  assert source == {'editable': '.'}
              else:
                  assert source == {'registry': 'https://pypi.org/simple'}, source
          for name, key in [('millrace-ai', 'CORE'), ('millrace-plus', 'PLUS')]:
              with urllib.request.urlopen('https://pypi.org/pypi/' + name + '/0.23.0/json', timeout=60) as response:
                  release = json.load(response)
              filename = name.replace('-', '_') + '-0.23.0-py3-none-any.whl'
              wheel, = [item for item in release['urls'] if item['filename'] == filename]
              assert wheel['digests']['sha256'] == os.environ[key + '_WHEEL_SHA256']
              with urllib.request.urlopen(wheel['url'], timeout=60) as response:
                  assert hashlib.sha256(response.read()).hexdigest() == os.environ[key + '_WHEEL_SHA256']
          PY
      - name: Build selected distributions
        run: |
          test ! -e dist
          uv build --python 3.12 --force-pep517
      - name: Verify exact artifact set, digests, and payload exclusions
        run: |
          .venv/bin/python - <<'PY'
          import hashlib, os, tarfile, zipfile
          from pathlib import Path
          expected = {
              'millrace_os-0.23.0-py3-none-any.whl': os.environ['EXPECTED_WHEEL_SHA256'],
              'millrace_os-0.23.0.tar.gz': os.environ['EXPECTED_SDIST_SHA256'],
          }
          assert {p.name for p in Path('dist').iterdir() if p.is_file()} - {'.gitignore'} == set(expected)
          lines = []
          for name, digest in expected.items():
              path = Path('dist') / name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
              if name.endswith('.whl'):
                  with zipfile.ZipFile(path) as archive:
                      members = archive.namelist()
              else:
                  with tarfile.open(path) as archive:
                      members = archive.getnames()
                      assert any(member.endswith('/uv.lock') for member in members)
              assert not any('/.github/' in '/' + member or member.endswith('/.gitignore') for member in members)
              lines.append(digest + '  ' + str(path))
          Path('release-sha256.txt').write_text('\n'.join(lines) + '\n')
          PY
      - name: Check source unchanged
        run: git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pypi-distributions
          if-no-files-found: error
          path: |
            dist/millrace_os-0.23.0-py3-none-any.whl
            dist/millrace_os-0.23.0.tar.gz
            release-sha256.txt
  publish:
    needs: build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/tags/v0.23.0') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pypi-distributions
          path: release/
      - name: Verify downloaded artifact set and exact digests
        run: |
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          expected = {
              'millrace_os-0.23.0-py3-none-any.whl': os.environ['EXPECTED_WHEEL_SHA256'],
              'millrace_os-0.23.0.tar.gz': os.environ['EXPECTED_SDIST_SHA256'],
          }
          root = Path('release')
          assert root.is_dir() and not root.is_symlink()
          assert {p.name for p in root.iterdir()} == {'dist', 'release-sha256.txt'}
          manifest = root / 'release-sha256.txt'
          assert manifest.is_file() and not manifest.is_symlink()
          packages = root / 'dist'
          assert packages.is_dir() and not packages.is_symlink()
          assert {p.name for p in packages.iterdir()} == set(expected)
          for name, digest in expected.items():
              path = packages / name
              assert path.is_file() and not path.is_symlink(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, name
          assert manifest.read_text() == ''.join(
              digest + '  dist/' + name + '\n' for name, digest in expected.items()
          )
          PY
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: release/dist/
