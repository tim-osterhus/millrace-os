name: CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_DATE_EPOCH: '1580601600'
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: 0.13.5
      - name: Require final public registry lock
        run: |
          test -f uv.lock
          uv lock --check --no-sources --python 3.12
          python3 - <<'PYCODE'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())
          assert not project.get("tool", {}).get("uv", {}).get("sources")
          lock = tomllib.loads(Path("uv.lock").read_text())
          versions = {}
          for package in lock["package"]:
              source = package["source"]
              if package["name"] == "millrace-os":
                  assert source == {"editable": "."}
              else:
                  assert source == {"registry": "https://pypi.org/simple"}, source
              if package["name"] in {"millrace-ai", "millrace-plus", "millrace-os"}:
                  versions[package["name"]] = package["version"]
          assert versions == {"millrace-ai": "0.23.1", "millrace-plus": "0.23.1", "millrace-os": "0.23.1"}
          PYCODE
          uv sync --frozen --no-editable --extra dev --extra router --python 3.12
      - name: Verify selected installed identities outside checkout
        shell: bash
        run: |
          python_path="$PWD/.venv/bin/python"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$python_path" - <<'PY'
          import importlib.metadata as m
          from pathlib import Path
          import millrace, millrace_plus, millrace_os
          for name, module in [('millrace-ai', millrace), ('millrace-plus', millrace_plus), ('millrace-os', millrace_os)]:
              assert m.version(name) == '0.23.1', name
              assert 'site-packages' in str(Path(module.__file__).resolve()), module.__file__
          from millrace_plus.router import require_core
          require_core()
          PY
      - name: Active OS tests and lint
        run: |
          env -u PYTHONPATH .venv/bin/python -m pytest -q -o pythonpath= tests
          .venv/bin/ruff check src tests
      - name: Build wheel and sdist
        run: uv build --python 3.12 --force-pep517
      - name: Verify base installation without router dependencies
        shell: bash
        run: |
          uv venv --python 3.12 .ci-base
          uv pip install --python .ci-base/bin/python dist/millrace_os-0.23.1-py3-none-any.whl
          python_path="$PWD/.ci-base/bin/python"
          cd "$RUNNER_TEMP"
          env -u PYTHONPATH "$python_path" - <<'PY'
          import importlib.util, tempfile
          from pathlib import Path
          assert importlib.util.find_spec('millrace') is None
          assert importlib.util.find_spec('millrace_plus') is None
          assert importlib.util.find_spec('mcp') is None
          from millrace_os.config import ApplicationConfig
          from millrace_os.router_client import RouterClient, RouterUnavailable
          from millrace_os.service import Service
          with tempfile.TemporaryDirectory() as folder:
              root = Path(folder)
              service = Service(ApplicationConfig(config_dir=root/'config', state_dir=root/'state', credential_path=root/'config/credentials.json'))
              assert service.app.version == '0.23.1'
              try:
                  RouterClient({'main': root/'core'}).list_instances('main')
              except RouterUnavailable as error:
                  assert error.code == 'router_unavailable'
              else:
                  raise AssertionError('missing optional router must refuse')
          PY
      - name: Check source unchanged
        run: git diff --exit-code

  optional-mcp:
    runs-on: macos-14
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: 0.13.5
      - name: Install frozen optional profile
        run: |
          uv lock --check --no-sources --python '${{ matrix.python }}'
          uv sync --frozen --no-editable --extra dev --extra router --extra mcp --python '${{ matrix.python }}'
      - name: Verify installed SDK transports and base boundaries
        run: |
          env -u PYTHONPATH .venv/bin/python -m pytest -q -o pythonpath= tests/mcp tests/foundation/test_packaging.py
          .venv/bin/ruff check src tests

  native-process:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86
        with:
          version: 0.13.5
      - name: Build and install current OS base wheel
        run: |
          uv build --wheel --force-pep517 --python 3.12 --out-dir "$RUNNER_TEMP/native-dist"
          uv venv --python 3.12 "$RUNNER_TEMP/native-env"
          uv pip install --python "$RUNNER_TEMP/native-env/bin/python" \
            "$RUNNER_TEMP/native-dist/millrace_os-0.23.1-py3-none-any.whl" pytest==9.0.2
          shasum -a 256 "$RUNNER_TEMP/native-dist/millrace_os-0.23.1-py3-none-any.whl"
      - name: Verify six native process identity cases outside checkout
        shell: bash
        run: |
          python_path="$RUNNER_TEMP/native-env/bin/python"
          cd "$RUNNER_TEMP"
          "$python_path" - <<'PY'
          import importlib.metadata as m, importlib.util
          from pathlib import Path
          import millrace_os
          assert m.version('millrace-os') == '0.23.1'
          assert 'site-packages' in str(Path(millrace_os.__file__).resolve())
          assert all(importlib.util.find_spec(name) is None for name in ['millrace', 'millrace_plus', 'mcp'])
          PY
          "$python_path" -m pytest -q -o pythonpath= \
            "$GITHUB_WORKSPACE/tests/foundation/test_process.py::test_native_birth_is_stable_and_microsecond_precision" \
            "$GITHUB_WORKSPACE/tests/foundation/test_process.py::test_refusal_never_signals" \
            "$GITHUB_WORKSPACE/tests/foundation/test_process.py::test_observation_failure_at_deadline_is_not_exit" \
            "$GITHUB_WORKSPACE/tests/foundation/test_process.py::test_stop_timeout_is_not_success" \
            --junitxml="$RUNNER_TEMP/native-process.xml"
          "$python_path" - <<'PY'
          import os, xml.etree.ElementTree as ET
          from pathlib import Path
          suites = list(ET.parse(Path(os.environ['RUNNER_TEMP']) / 'native-process.xml').iter('testsuite'))
          counts = {key: sum(int(suite.attrib[key]) for suite in suites) for key in ['tests', 'failures', 'errors', 'skipped']}
          assert counts == {'tests': 6, 'failures': 0, 'errors': 0, 'skipped': 0}, counts
          print(counts)
          PY
