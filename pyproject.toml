[build-system]
requires = ["uv_build==0.11.28"]
build-backend = "uv_build"

[project]
name = "millrace-os"
version = "0.23.0"
description = "A local headless service for independent Millrace workflow instances."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Millrace" }]
dependencies = [
    "fastapi==0.116.1",
    "pydantic==2.11.9",
    "uvicorn==0.35.0",
]

[project.optional-dependencies]
router = ["millrace-plus[router]>=0.23.0,<0.24.0"]
dev = ["pytest==9.0.2", "ruff==0.14.14", "httpx==0.28.1"]
browser = ["playwright==1.55.0"]

[project.scripts]
millrace-os = "millrace_os.cli:main"

[tool.uv.build-backend]
module-root = "src"
module-name = "millrace_os"
source-include = ["docs/**", "tests/**", "uv.lock"]
source-exclude = ["/.github", "/.gitignore", "/dist", "/.venv", "__pycache__", "*.pyc", ".DS_Store"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-p", "no:faker"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
